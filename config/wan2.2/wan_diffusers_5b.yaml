format: diffusers
pipeline: Wan
transformer_additional_kwargs:
  transformer_low_noise_model_subpath: transformer
  transformer_combination_type: "single"
  in_dim: 48
  out_dim: 48
  dim: 3072
  hidden_size: 3072
  num_heads: 24
  qk_norm: true

vae_kwargs:
  vae_type: "AutoencoderKLWan3_8"
  vae_subpath: vae
  temporal_compression_ratio: 4
  spatial_compression_ratio: 16

text_encoder_kwargs:
  text_encoder_subpath: text_encoder
  tokenizer_subpath: tokenizer
  text_length: 512
  vocab: 256384
  dim: 4096
  dim_attn: 4096
  dim_ffn: 10240
  num_heads: 64
  num_layers: 24
  num_buckets: 32
  shared_pos: False
  dropout: 0.0

scheduler_kwargs:
  scheduler_subpath: scheduler
  num_train_timesteps: 1000
  shift: 5.0
  use_dynamic_shifting: false
  base_shift: 0.5
  max_shift: 1.15
  base_image_seq_len: 256
  max_image_seq_len: 4096

image_encoder_kwargs:
  image_encoder_subpath: image_encoder
